name: Suchkürzel-Transfer App

on:
  push:
    paths:
      - "browser-suchmigration/app/**"
      - "browser-suchmigration/Suchkuerzel-Transfer.command"
      - ".github/workflows/suchkuerzel-transfer.yml"
  pull_request:
    paths:
      - "browser-suchmigration/app/**"
      - "browser-suchmigration/Suchkuerzel-Transfer.command"
      - ".github/workflows/suchkuerzel-transfer.yml"
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: browser-suchmigration/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt-Laufzeit installieren
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install -r requirements.txt
      - name: Core-Selbsttest
        run: python main.py --self-test
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Plattformpaket bauen
        run: pyinstaller --noconfirm --clean SuchkuerzelTransfer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SuchkuerzelTransfer-${{ matrix.os }}
          path: browser-suchmigration/app/dist/
